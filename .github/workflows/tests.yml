name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio
      - name: Run test suite
        run: python -m pytest tests/ -q

  grammar-check:
    # GRAMMAR.md is the contract: the canonical examples in it must parse
    # and run. Guards against spec/doc drift (v1.x's documented forms
    # silently stopped parsing — this job makes that impossible).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Grammar conformance smoke
        run: |
          set -e
          echo 'let x = 5
          fn double(n) { return n * 2 }
          print(double(x))' > /tmp/g1.zx
          python -m zexus /tmp/g1.zx
